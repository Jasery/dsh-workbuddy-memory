name: Publish

# Tag-driven: pushing a `v*` tag is the release decision, everything after it is
# mechanical. Nothing here can run for a commit or a pull request, so a merge to
# `main` never ships a version by accident.
#
# `workflow_dispatch` covers two cases that a tag push cannot:
#   * a release whose publish step failed — re-run it without deleting and
#     re-pushing the tag, because the tag is the record and rewriting it would
#     be a lie;
#   * `dry_run: true` — rehearse the whole path (checks, install, tests,
#     `npm publish --dry-run`, notes) against the branch being dispatched, with
#     no registry write and no release page. A rehearsal has to run the code that
#     is about to be tagged, so it takes its version from the manifest rather
#     than from a tag.
#
# The npm token lives in the `NPM_TOKEN` repository secret. Without it the job
# fails at the publish step and nothing is released, which is the safe default.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to re-release, e.g. v0.2.3 (ignored when rehearsing)'
        required: false
        type: string
      dry_run:
        description: 'Rehearse against this branch: no publish, no release'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  # Never cancel a publish midway: npm stages a version before it commits it,
  # and a cancelled run can leave the version staged.
  cancel-in-progress: false

permissions:
  contents: write # creating the release
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      # Which commit to build is a different question from which version this is.
      #
      # A tag push releases the tagged commit, so the tag is checked out. A
      # rehearsal runs code that is not tagged yet, so it checks out the branch
      # the run was launched from — checking out the tag instead ran the old tree
      # and died with "Cannot find module scripts/check-release.mjs" on a tag that
      # predates these scripts.
      #
      # `fetch-depth: 0` is required either way: the notes script asks git for the
      # previous tag to build the compare link.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.ref || inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # The version is the tag being released, except in a rehearsal, where it is
      # whatever the manifest says — there is no tag for code that is not released.
      - name: Decide which version this is
        id: version
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            version="$(node -p "require('./package.json').version")"
            echo "::notice::dry run: rehearsing $version from the manifest, not from a tag"
          else
            version="${TAG#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "resolved version: $version"

      # The tag, the manifest and both changelogs are three separate statements
      # about which version this is, and nothing else compares them.
      - name: Refuse a version that disagrees with the manifest or the changelog
        id: check
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -o pipefail
          node scripts/check-release.mjs "$VERSION" --allow-published | tee check.txt
          echo "published=$(sed -n 's/^already-published: //p' check.txt)" >> "$GITHUB_OUTPUT"

      # Tests run against the exact commit being published: a tag can be pushed
      # for a commit that never went through CI on `main`.
      - run: npm ci
      - run: npm test

      - name: Publish to npm
        if: steps.check.outputs.published != 'true' && env.DRY_RUN != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A rehearsal has to exercise `npm publish`, because that is the step with
      # the failure modes nothing else catches: an unusable token, provenance
      # that the registry rejects, a `files` list that omits something the
      # plugin loads at runtime.
      #
      # `npm publish --dry-run` still refuses a version that already exists, so
      # rehearsing an already-released version would silently skip the one step
      # worth testing. Stamping a prerelease suffix into the checkout's manifest
      # gives the same bytes a version the registry has never seen; the working
      # tree is disposable and never committed.
      - name: Rehearse the publish
        if: env.DRY_RUN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED: ${{ steps.check.outputs.published }}
        run: |
          set -o pipefail
          tag="latest"
          if [ "$PUBLISHED" = "true" ]; then
            rehearsal="$(node -p "require('./package.json').version")-rehearsal.$(date +%s)"
            echo "::notice::${{ steps.version.outputs.value }} is already published; rehearsing as $rehearsal"
            npm version "$rehearsal" --no-git-tag-version --allow-same-version >/dev/null
            # npm refuses a prerelease without an explicit dist-tag. A real
            # release never hits this (0.2.3 is not a prerelease), but the
            # rehearsal does, and it would rather fail here than teach the wrong
            # lesson about the publish path.
            tag="rehearsal"
          fi
          npm publish --access public --dry-run --provenance --tag "$tag"

      - name: Skip the publish, the version is already on npm
        if: steps.check.outputs.published == 'true' && env.DRY_RUN != 'true'
        run: echo "::notice::${{ steps.version.outputs.value }} is already on npm; only the release notes are (re)created"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/release-notes.mjs "$VERSION" --out notes.md --title-out title.txt

      - name: Show the release body
        run: cat notes.md

      - name: Create or update the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          title="$(cat title.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag --latest
          fi
